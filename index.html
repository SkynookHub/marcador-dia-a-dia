<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Semana</title>
<link rel="icon" type="image/png" href="images/zorro.png">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#222;--mu:#777;--ac:#6c4cf1;--ok:#22a06b;--bd:#e5e1d8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15141a;--card:#201f28;--tx:#eee;--mu:#9a98a6;--bd:#33313d}}
:root[data-theme="dark"]{--bg:#15141a;--card:#201f28;--tx:#eee;--mu:#9a98a6;--bd:#33313d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:76px}
main{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:10px;width:42px;height:42px;font-size:18px}
.nav b{text-align:center;text-transform:capitalize}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.c.done{border-color:var(--ok)}
.r{display:flex;align-items:center;gap:8px}
.r .t{flex:1}
.t small{display:block;color:var(--mu);font-size:13px}
button{font:inherit;cursor:pointer}
.b{border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:10px;padding:8px 10px;min-height:40px}
.b.on{background:var(--ok);border-color:var(--ok);color:#fff}
.b.ac{background:var(--ac);border-color:var(--ac);color:#fff}
.row2{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac)}
.bar i.f{background:var(--ok)}
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hm div{aspect-ratio:1;border-radius:6px;background:var(--bd);font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:12px 0;font-size:14px}
.tabs button.on{color:var(--ac);font-weight:600}
textarea{width:100%;min-height:110px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px;font:12px monospace}
.mu{color:var(--mu);font-size:14px}
</style>
</head>
<body>
<main id="app"></main>
<div class="tabs" id="tabs"></div>
<script>
const A=[
{k:'gym',n:'Gym',e:'🏋️',g:4},{k:'godot',n:'Godot',e:'👾',g:3},{k:'dib',n:'Dibujo para redes',e:'🎨',g:2},
{k:'ani',n:'Animación',e:'🎬',g:1},{k:'esc',n:'Escritura',e:'✍️',g:3},{k:'lec',n:'Lectura',e:'📖',g:7},
{k:'casa',n:'Ordenar casa',e:'🧹',g:7},{k:'vj',n:'Videojuegos',e:'🕹️',g:0}];
const KEY='mi_semana_v1';
let S={log:{},timer:null},view='hoy',cur=new Date(),tick=null;
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const dk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ent=(d,k)=>(S.log[d]&&S.log[d][k])||{done:false,min:0};
function set(d,k,f){S.log[d]=S.log[d]||{};const e=ent(d,k);f(e);S.log[d][k]=e;save()}
function weekDays(d){const x=new Date(d);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return[...Array(7)].map((_,i)=>{const y=new Date(x);y.setDate(x.getDate()+i);return dk(y)})}
function wk(k,d){const ds=weekDays(d);return{n:ds.filter(x=>ent(x,k).done).length,m:ds.reduce((s,x)=>s+ent(x,k).min,0)}}
function stopTimer(){if(!S.timer)return;const t=S.timer,m=Math.max(1,Math.round((Date.now()-t.s)/60000));set(t.d,t.k,e=>{e.min+=m;e.done=true});S.timer=null;save()}
function fmt(m){return m>=60?Math.floor(m/60)+'h '+(m%60)+'m':m+' min'}
function hoy(){
 const d=dk(cur),today=dk(new Date());
 const nm=cur.toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
 let h=`<div class="nav"><button data-a="prev">‹</button><b>${d===today?'Hoy · ':''}${nm}</b><button data-a="next">›</button></div>`;
 A.forEach(a=>{const e=ent(d,a.k),w=wk(a.k,cur),run=S.timer&&S.timer.k===a.k&&S.timer.d===d;
  h+=`<div class="c ${e.done?'done':''}"><div class="r"><span style="font-size:26px">${a.e}</span><div class="t"><b>${a.n}</b><small>Hoy: ${fmt(e.min)} · Semana: ${w.n}${a.g?'/'+a.g:''} días</small></div>
  <button class="b ${e.done?'on':''}" data-a="chk" data-k="${a.k}">${e.done?'✓ Hecho':'Marcar'}</button></div>
  <div class="row2">${run?`<button class="b ac" data-a="stop" data-k="${a.k}">⏹ Parar · <span id="tm">0:00</span></button>`:`<button class="b" data-a="play" data-k="${a.k}">▶ Cronómetro</button>`}
  <button class="b" data-a="add" data-k="${a.k}" data-v="15">+15</button><button class="b" data-a="add" data-k="${a.k}" data-v="30">+30</button><button class="b" data-a="add" data-k="${a.k}" data-v="-15">−15</button></div></div>`});
 return h}
function sem(){
 const ds=weekDays(cur);let tot=0,met=0,goals=0;
 let h='<h1>Esta semana</h1>';
 A.forEach(a=>{const w=wk(a.k,cur);tot+=w.m;if(a.g){goals++;if(w.n>=a.g)met++}
  const p=a.g?Math.min(100,w.n/a.g*100):0;
  h+=`<div class="c"><div class="r"><span style="font-size:22px">${a.e}</span><div class="t"><b>${a.n}</b><small>${a.g?w.n+' de '+a.g+' días':w.n+' días'} · ${fmt(w.m)}</small></div>${a.g&&w.n>=a.g?'<span>✅</span>':''}</div>${a.g?`<div class="bar"><i class="${w.n>=a.g?'f':''}" style="width:${p}%"></i></div>`:''}</div>`});
 h=h.replace('<h1>Esta semana</h1>',`<h1>Esta semana</h1><div class="c"><b>${met} de ${goals} metas cumplidas</b><div class="mu">Tiempo total registrado: ${fmt(tot)}</div></div>`);
 h+='<h1>Últimos 28 días</h1><div class="c"><div class="hm">';
 for(let i=27;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);const k=dk(x);const n=A.filter(a=>ent(k,a.k).done).length;
  h+=`<div style="opacity:${n?0.35+Math.min(n,5)*0.13:1};${n?'background:var(--ok);color:#fff':''}">${x.getDate()}</div>`}
 return h+'</div><p class="mu">Más verde = más actividades hechas ese día.</p></div>'}
function ajus(){return`<h1>Respaldo</h1><div class="c"><p class="mu">Tus datos viven solo en este navegador. Exporta una copia de vez en cuando, o para pasarla a otro dispositivo.</p>
<textarea id="ta" placeholder="Aquí aparece tu copia"></textarea><div class="row2"><button class="b ac" data-a="exp">Exportar</button><button class="b" data-a="imp">Importar</button><button class="b" data-a="reset">Borrar todo</button></div></div>`}
function draw(){
 document.getElementById('app').innerHTML=view==='hoy'?hoy():view==='sem'?sem():ajus();
 document.getElementById('tabs').innerHTML=[['hoy','📅 Hoy'],['sem','📊 Semana'],['aj','💾 Respaldo']].map(t=>`<button data-a="tab" data-k="${t[0]}" class="${view===t[0]?'on':''}">${t[1]}</button>`).join('');
 clearInterval(tick);
 if(S.timer&&view==='hoy'){const u=()=>{const el=document.getElementById('tm');if(!el)return;const s=Math.floor((Date.now()-S.timer.s)/1000);el.textContent=Math.floor(s/60)+':'+pad(s%60)};u();tick=setInterval(u,1000)}}
document.addEventListener('click',ev=>{
 const b=ev.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,d=dk(cur);
 if(a==='tab')view=k;
 else if(a==='prev')cur.setDate(cur.getDate()-1);
 else if(a==='next')cur.setDate(cur.getDate()+1);
 else if(a==='chk')set(d,k,e=>e.done=!e.done);
 else if(a==='add')set(d,k,e=>{e.min=Math.max(0,e.min+ +b.dataset.v);if(e.min>0)e.done=true});
 else if(a==='play'){stopTimer();S.timer={k,d,s:Date.now()};save()}
 else if(a==='stop')stopTimer();
 else if(a==='exp'){document.getElementById('ta').value=JSON.stringify(S.log);return}
 else if(a==='imp'){try{const o=JSON.parse(document.getElementById('ta').value);if(typeof o==='object'){S.log=o;save();alert('Datos importados')}}catch(e){alert('Formato inválido')}return}
 else if(a==='reset'){if(confirm('¿Borrar todo el historial?')){S={log:{},timer:null};save()}}
 draw()});
draw();
</script>
</body>
</html>
